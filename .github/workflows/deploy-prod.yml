# =============================================================================
# Alpla Angola - Portal Gerencial
# GitHub Actions Workflow: Deploy to PRODUCTION Environment
# =============================================================================
#
# Target Server:      AOVIA1VMS011
# Target Environment: PRODUCTION
# Official URL:       https://portalgerencial.alpla.net/
# API Port:           5002 (NOT 5000 or 5001)
#
# This workflow builds the backend (.NET 8) and frontend (React/Vite),
# then deploys both to the PRODUCTION environment on the self-hosted runner.
#
# IMPORTANT:
# - This workflow does NOT touch the Test environment.
# - This workflow does NOT touch port 5001 or Test App Pools.
# - This workflow creates a SQL backup before deployment.
# - This workflow validates the target database is [Portal-Gerencial].
# - Migrations are NOT automated — the workflow checks for pending
#   migrations and blocks startup if any are found (DEC-137).
#
# SAFETY:
# - Requires GitHub environment 'production' with approval gates.
# - Separate concurrency group from Test deployments.
# - Database name validation prevents accidental Test DB modifications.
# =============================================================================

name: Deploy to PRODUCTION

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v2.185.0)'
        required: true
        type: string

# Prevent concurrent deployments to PRODUCTION
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Job 1: Build
  # ===========================================================================
  # Compiles backend and frontend on a GitHub-hosted runner, then uploads
  # the artifacts for the deploy job.
  # ===========================================================================
  build:
    name: Build (${{ inputs.version }})
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      # --- Checkout ---
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Backend (.NET 8) ---
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend dependencies
        run: dotnet restore src/backend/AlplaPortal.sln

      - name: Build backend (Release)
        run: dotnet build src/backend/AlplaPortal.sln --configuration Release --no-restore

      - name: Publish backend API
        run: >
          dotnet publish src/backend/AlplaPortal.Api/AlplaPortal.Api.csproj
          --configuration Release
          --no-build
          --output ${{ github.workspace }}/artifacts/api

      # --- Frontend (React + Vite) ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Frontend type check
        working-directory: src/frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build

      - name: Copy frontend dist to artifact folder
        shell: pwsh
        run: |
          $source = "src/frontend/dist"
          $destination = "${{ github.workspace }}/artifacts/web"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          robocopy $source $destination /E /NFL /NDL /NJH /NJS /NC /NS /NP
          if ($LASTEXITCODE -gt 7) { throw "Frontend dist copy failed with robocopy exit code $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

      - name: Validate frontend artifact structure
        shell: pwsh
        run: |
          $assetsDir = "${{ github.workspace }}/artifacts/web/assets"
          if (-not (Test-Path $assetsDir)) {
            throw "FATAL: artifacts/web/assets/ directory is missing. Vite build output was not preserved correctly."
          }
          $jsFiles = Get-ChildItem -Path $assetsDir -Filter "*.js" -ErrorAction SilentlyContinue
          $cssFiles = Get-ChildItem -Path $assetsDir -Filter "*.css" -ErrorAction SilentlyContinue
          if (-not $jsFiles) { throw "FATAL: No .js files found in artifacts/web/assets/" }
          if (-not $cssFiles) { throw "FATAL: No .css files found in artifacts/web/assets/" }
          Write-Host "Frontend artifact structure validated:"
          Write-Host "  JS files: $($jsFiles.Count)"
          Write-Host "  CSS files: $($cssFiles.Count)"

      # --- Generate Expected Migration List (DEC-139) ---
      - name: Generate expected migration list
        shell: pwsh
        run: |
          $migrationsPath = "src/backend/AlplaPortal.Infrastructure/Data/Migrations"
          $outputFile = "${{ github.workspace }}/artifacts/api/expected-migrations.txt"
          $migrations = Get-ChildItem -Path $migrationsPath -Filter "*.cs" -Name |
            Where-Object { $_ -notmatch '\.Designer\.cs$' -and $_ -notmatch 'Snapshot\.cs$' } |
            ForEach-Object { $_ -replace '\.cs$', '' } |
            Sort-Object
          $migrations | Set-Content -Path $outputFile -Encoding UTF8
          Write-Host "Generated expected-migrations.txt with $($migrations.Count) migrations"

      # --- Upload Artifacts ---
      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-artifact-prod
          path: ${{ github.workspace }}/artifacts/api
          retention-days: 14
          if-no-files-found: error

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-artifact-prod
          path: ${{ github.workspace }}/artifacts/web
          retention-days: 14
          if-no-files-found: error

  # ===========================================================================
  # Job 2: Deploy to PRODUCTION
  # ===========================================================================
  # Downloads artifacts on the self-hosted runner, validates the database,
  # creates backups, stops IIS, deploys new files, starts IIS, and runs
  # a smoke test.
  #
  # SAFETY:
  # - Database name validation (must be [Portal-Gerencial], NOT [Portal-Gerencial-Test])
  # - SQL backup before deployment
  # - Only touches PRODUCTION App Pools (never Test)
  # - GitHub environment approval gate
  # ===========================================================================
  deploy-prod:
    name: Deploy PRODUCTION (${{ inputs.version }})
    needs: build
    runs-on: [self-hosted, Windows, X64, iis]
    timeout-minutes: 20
    environment: production

    env:
      ARTIFACT_API_PATH: C:\ActionsArtifacts\AlplaPortal\prod\api
      ARTIFACT_WEB_PATH: C:\ActionsArtifacts\AlplaPortal\prod\web

    steps:
      # --- Download Artifacts ---
      - name: Clean artifact staging directories
        shell: pwsh
        run: |
          if (Test-Path "${{ env.ARTIFACT_API_PATH }}") {
            Remove-Item -Path "${{ env.ARTIFACT_API_PATH }}" -Recurse -Force
          }
          if (Test-Path "${{ env.ARTIFACT_WEB_PATH }}") {
            Remove-Item -Path "${{ env.ARTIFACT_WEB_PATH }}" -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path "${{ env.ARTIFACT_API_PATH }}" | Out-Null
          New-Item -ItemType Directory -Force -Path "${{ env.ARTIFACT_WEB_PATH }}" | Out-Null

      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-artifact-prod
          path: ${{ env.ARTIFACT_API_PATH }}

      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-artifact-prod
          path: ${{ env.ARTIFACT_WEB_PATH }}

      # --- Pre-Deploy Database Validation & Backup ---
      - name: Validate Production database name
        shell: pwsh
        run: |
          $connStr = "${{ secrets.PROD_DB_CONNECTION_STRING }}"
          if ([string]::IsNullOrWhiteSpace($connStr)) {
            Write-Host "::warning::PROD_DB_CONNECTION_STRING secret is not set. Skipping database validation."
            Write-Host "::warning::Database validation will rely on application startup."
            exit 0
          }

          # Diagnostic: detect common connection string issues before attempting to connect
          $connStrTrimmed = $connStr.Trim()
          if ($connStrTrimmed -ne $connStr) {
            Write-Host "::warning::PROD_DB_CONNECTION_STRING has leading/trailing whitespace. This may cause parsing failures."
            $connStr = $connStrTrimmed
          }
          if ($connStr -match '[\r\n]') {
            Write-Host "::error::PROD_DB_CONNECTION_STRING contains newline characters. GitHub secrets must be a single line."
            Write-Host "::error::Go to GitHub > Settings > Secrets > PROD_DB_CONNECTION_STRING and re-enter it as a single line."
            throw "Connection string contains newline characters — cannot parse."
          }

          try {
            $conn = New-Object System.Data.SqlClient.SqlConnection($connStr)
            $conn.Open()
            $cmd = $conn.CreateCommand()
            $cmd.CommandText = "SELECT DB_NAME() AS DatabaseName"
            $reader = $cmd.ExecuteReader()

            if ($reader.Read()) {
              $dbName = $reader["DatabaseName"]
              Write-Host "::notice::Connected to database: [$dbName]"

              if ($dbName -eq "Portal-Gerencial-Test") {
                $reader.Close()
                $conn.Close()
                throw "CRITICAL SAFETY CHECK FAILED: Connection string resolves to TEST database [Portal-Gerencial-Test]. Production deployment BLOCKED."
              }

              if ($dbName -ne "Portal-Gerencial") {
                $reader.Close()
                $conn.Close()
                throw "SAFETY CHECK FAILED: Expected database [Portal-Gerencial], got [$dbName]. Production deployment BLOCKED."
              }

              Write-Host "::notice::Database validation PASSED: target is [Portal-Gerencial]"
            }

            $reader.Close()
            $conn.Close()
          } catch {
            if ($_.Exception.Message -match "SAFETY CHECK") {
              throw
            }
            # Provide actionable guidance for connection string parsing errors
            if ($_.Exception.Message -match "Format of the initialization string") {
              Write-Host "::error::The PROD_DB_CONNECTION_STRING secret could not be parsed by SqlConnection."
              Write-Host "::error::Common causes:"
              Write-Host "::error::  1. Password contains an unescaped semicolon (;) — wrap the password in single quotes in the connection string."
              Write-Host "::error::  2. The secret was pasted with line breaks or invisible Unicode characters."
              Write-Host "::error::  3. The secret has trailing whitespace or BOM characters."
              Write-Host "::error::Fix: Go to GitHub > Repository > Settings > Secrets and re-enter PROD_DB_CONNECTION_STRING as a single, clean line."
            }
            Write-Host "::warning::Database connection test failed: $_"
            Write-Host "::warning::Deployment will continue — the application will validate on startup."
          }

      - name: Create SQL database backup
        shell: pwsh
        run: |
          $connStr = "${{ secrets.PROD_DB_CONNECTION_STRING }}"
          if ([string]::IsNullOrWhiteSpace($connStr)) {
            Write-Host "::warning::PROD_DB_CONNECTION_STRING not set. Skipping SQL backup."
            exit 0
          }

          $backupDir = "${{ vars.BACKUP_PATH }}\db"
          if (-not (Test-Path $backupDir)) {
            New-Item -ItemType Directory -Force -Path $backupDir | Out-Null
          }

          $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
          $backupFile = Join-Path $backupDir "Portal-Gerencial_$timestamp.bak"

          try {
            $conn = New-Object System.Data.SqlClient.SqlConnection($connStr)
            $conn.Open()

            # Detect SQL Server edition to decide if COMPRESSION is supported
            $editionCmd = $conn.CreateCommand()
            $editionCmd.CommandText = "SELECT SERVERPROPERTY('Edition') AS Edition"
            $editionResult = $editionCmd.ExecuteScalar()
            $edition = [string]$editionResult
            Write-Host "::notice::SQL Server Edition: $edition"

            # Express Edition does not support BACKUP WITH COMPRESSION
            if ($edition -match 'Express') {
              $backupSql = "BACKUP DATABASE [Portal-Gerencial] TO DISK = '$backupFile' WITH FORMAT, NAME = 'Pre-Deploy Backup ${{ inputs.version }}'"
              Write-Host "::notice::Using backup WITHOUT compression (Express Edition detected)."
            } else {
              $backupSql = "BACKUP DATABASE [Portal-Gerencial] TO DISK = '$backupFile' WITH FORMAT, COMPRESSION, NAME = 'Pre-Deploy Backup ${{ inputs.version }}'"
              Write-Host "::notice::Using backup WITH compression."
            }

            $cmd = $conn.CreateCommand()
            $cmd.CommandTimeout = 300
            $cmd.CommandText = $backupSql
            $cmd.ExecuteNonQuery() | Out-Null
            $conn.Close()
            Write-Host "::notice::Database backup created: $backupFile"
          } catch {
            Write-Host "::warning::Database backup failed: $_"
            Write-Host "::warning::Deployment will continue. Manual backup recommended before verifying."
          }

      # --- Backup Current Files ---
      - name: Create timestamped file backup
        shell: pwsh
        run: |
          $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
          $backupDir = Join-Path "${{ vars.BACKUP_PATH }}" "backup_$timestamp"
          New-Item -ItemType Directory -Force -Path $backupDir | Out-Null

          Write-Host "::notice::Backup directory: $backupDir"

          # Backup current API folder
          $apiDeploy = "${{ vars.API_DEPLOY_PATH }}"
          if (Test-Path $apiDeploy) {
            $apiBackup = Join-Path $backupDir "api"
            Write-Host "Backing up API from $apiDeploy to $apiBackup"
            robocopy $apiDeploy $apiBackup /E /NFL /NDL /NJH /NJS /NC /NS /NP
            if ($LASTEXITCODE -gt 7) { throw "API backup failed with robocopy exit code $LASTEXITCODE" }
          } else {
            Write-Host "::warning::API deploy path does not exist yet. Skipping API backup."
          }

          # Backup current Web folder
          $webDeploy = "${{ vars.WEB_DEPLOY_PATH }}"
          if (Test-Path $webDeploy) {
            $webBackup = Join-Path $backupDir "web"
            Write-Host "Backing up Web from $webDeploy to $webBackup"
            robocopy $webDeploy $webBackup /E /NFL /NDL /NJH /NJS /NC /NS /NP
            if ($LASTEXITCODE -gt 7) { throw "Web backup failed with robocopy exit code $LASTEXITCODE" }
          } else {
            Write-Host "::warning::Web deploy path does not exist yet. Skipping Web backup."
          }

          # Reset exit code so the step doesn't fail on robocopy success codes 1-7
          $global:LASTEXITCODE = 0

      # --- Stop PRODUCTION IIS App Pools ---
      - name: Stop Production IIS App Pools
        shell: pwsh
        run: |
          Import-Module WebAdministration

          $apiPool = "${{ vars.IIS_API_APPPOOL }}"
          $webPool = "${{ vars.IIS_WEB_APPPOOL }}"

          foreach ($pool in @($apiPool, $webPool)) {
            $state = (Get-WebAppPoolState -Name $pool).Value
            if ($state -eq "Started") {
              Write-Host "Stopping App Pool: $pool"
              Stop-WebAppPool -Name $pool
            } else {
              Write-Host "App Pool '$pool' is already in state: $state"
            }
          }

          # Wait for pools to fully stop
          Start-Sleep -Seconds 5

          foreach ($pool in @($apiPool, $webPool)) {
            $state = (Get-WebAppPoolState -Name $pool).Value
            Write-Host "App Pool '$pool' state after stop: $state"
          }

      # --- Deploy API ---
      - name: Deploy API files
        shell: pwsh
        run: |
          $apiSource = "${{ env.ARTIFACT_API_PATH }}"
          $apiDeploy = "${{ vars.API_DEPLOY_PATH }}"

          # Ensure deploy directory exists
          if (-not (Test-Path $apiDeploy)) {
            New-Item -ItemType Directory -Force -Path $apiDeploy | Out-Null
          }

          # ---------------------------------------------------------------
          # Preserve environment-specific configuration files on the server.
          # These files contain server-side secrets and environment config
          # that must NOT be overwritten by the build artifact.
          # ---------------------------------------------------------------
          $configFilesToPreserve = @(
            "appsettings.Production.json",
            "appsettings.Staging.json",
            "appsettings.Test.json",
            "appsettings.Local.json"
          )

          $tempConfigDir = Join-Path $env:TEMP "AlplaPortal_ConfigBackup_Prod_API"
          if (Test-Path $tempConfigDir) { Remove-Item -Path $tempConfigDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $tempConfigDir | Out-Null

          # Save existing config files
          $preservedFiles = @()
          foreach ($configFile in $configFilesToPreserve) {
            $sourcePath = Join-Path $apiDeploy $configFile
            if (Test-Path $sourcePath) {
              Copy-Item -Path $sourcePath -Destination $tempConfigDir -Force
              $preservedFiles += $configFile
              Write-Host "Preserved: $configFile"
            }
          }

          # Deploy new API files (overwrite existing, add new, but do NOT mirror/delete)
          Write-Host "Deploying API files from $apiSource to $apiDeploy"
          robocopy $apiSource $apiDeploy /E /IS /IT /NFL /NDL /NJH /NJS /NC /NS /NP
          if ($LASTEXITCODE -gt 7) { throw "API deployment failed with robocopy exit code $LASTEXITCODE" }

          # Restore preserved config files (overwrite whatever the artifact brought)
          foreach ($configFile in $preservedFiles) {
            $backupPath = Join-Path $tempConfigDir $configFile
            $targetPath = Join-Path $apiDeploy $configFile
            Copy-Item -Path $backupPath -Destination $targetPath -Force
            Write-Host "Restored: $configFile"
          }

          # Cleanup temp
          Remove-Item -Path $tempConfigDir -Recurse -Force -ErrorAction SilentlyContinue

          # Reset exit code
          $global:LASTEXITCODE = 0

      # --- Deploy Web ---
      - name: Deploy Web files
        shell: pwsh
        run: |
          $webSource = "${{ env.ARTIFACT_WEB_PATH }}"
          $webDeploy = "${{ vars.WEB_DEPLOY_PATH }}"

          # Ensure deploy directory exists
          if (-not (Test-Path $webDeploy)) {
            New-Item -ItemType Directory -Force -Path $webDeploy | Out-Null
          }

          # ---------------------------------------------------------------
          # Preserve the server-side web.config (PRODUCTION reverse proxy
          # targeting port 5002). The build artifact ships with port 5001
          # (Test). We must NEVER overwrite this file.
          # ---------------------------------------------------------------
          $serverWebConfig = Join-Path $webDeploy "web.config"
          $tempWebConfig = Join-Path $env:TEMP "AlplaPortal_Prod_WebConfig_Backup_web.config"
          $preserveWebConfig = $false

          if (Test-Path $serverWebConfig) {
            Copy-Item -Path $serverWebConfig -Destination $tempWebConfig -Force
            $preserveWebConfig = $true
            Write-Host "Preserved server-side Production web.config (port 5002)"
          }

          # Deploy new Web files (mirror = clean old hashed assets)
          Write-Host "Deploying Web files from $webSource to $webDeploy"
          robocopy $webSource $webDeploy /MIR /NFL /NDL /NJH /NJS /NC /NS /NP
          if ($LASTEXITCODE -gt 7) { throw "Web deployment failed with robocopy exit code $LASTEXITCODE" }

          # Restore preserved web.config (ALWAYS for Production)
          if ($preserveWebConfig -and (Test-Path $tempWebConfig)) {
            Copy-Item -Path $tempWebConfig -Destination $serverWebConfig -Force
            Write-Host "Restored server-side Production web.config (port 5002)"
            Remove-Item -Path $tempWebConfig -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "::warning::No server-side web.config was preserved. Ensure the Production web.config exists with port 5002."
          }

          # Reset exit code
          $global:LASTEXITCODE = 0

      # --- Check for Pending EF Core Migrations (DEC-137 + DEC-139) ---
      # This step detects pending migrations BEFORE starting the App Pools.
      # If any migrations are missing, the deployment fails early with a clear
      # message instead of letting the API crash with HTTP 500.30.
      # The expected migration list is auto-generated from the migrations folder
      # and packaged in expected-migrations.txt during the build job (DEC-139).
      - name: Check for pending EF Core migrations
        shell: pwsh
        run: |
          $connStr = "${{ secrets.PROD_DB_CONNECTION_STRING }}"
          if ([string]::IsNullOrWhiteSpace($connStr)) {
            # Fallback: try reading from preserved appsettings.Production.json
            $apiDeploy = "${{ vars.API_DEPLOY_PATH }}"
            $configFile = Join-Path $apiDeploy "appsettings.Production.json"
            if (Test-Path $configFile) {
              $config = Get-Content $configFile -Raw | ConvertFrom-Json
              $connStr = $config.ConnectionStrings.DefaultConnection
            }
          }

          if ([string]::IsNullOrWhiteSpace($connStr)) {
            Write-Host "::warning::No connection string available. Skipping migration check."
            Write-Host "::warning::The API may fail to start if migrations are pending."
            exit 0
          }

          Write-Host "::notice::Checking EF Core migrations against PRODUCTION database..."

          try {
            $conn = New-Object System.Data.SqlClient.SqlConnection($connStr)
            $conn.Open()

            # Safety check: confirm database name is NOT the Test database
            $dbCmd = $conn.CreateCommand()
            $dbCmd.CommandText = "SELECT DB_NAME()"
            $dbName = $dbCmd.ExecuteScalar()
            Write-Host "Connected to database: [$dbName]"

            if ($dbName -eq "Portal-Gerencial-Test") {
              $conn.Close()
              throw "CRITICAL SAFETY CHECK: Connection string resolves to TEST database. PRODUCTION deployment BLOCKED."
            }

            # Read applied migrations
            $cmd = $conn.CreateCommand()
            $cmd.CommandText = "SELECT MigrationId FROM __EFMigrationsHistory ORDER BY MigrationId"
            $reader = $cmd.ExecuteReader()
            $applied = @()
            while ($reader.Read()) { $applied += $reader["MigrationId"].ToString() }
            $reader.Close()
            $conn.Close()

            Write-Host "Applied migrations in [$dbName]: $($applied.Count)"

            # Load expected migrations from auto-generated file (DEC-139)
            $apiDeploy = "${{ vars.API_DEPLOY_PATH }}"
            $migrationListFile = Join-Path $apiDeploy "expected-migrations.txt"
            if (Test-Path $migrationListFile) {
              $expected = Get-Content $migrationListFile | Where-Object { $_ -match '\S' } | ForEach-Object { $_.Trim() }
              Write-Host "::notice::Loaded $($expected.Count) expected migrations from expected-migrations.txt (DEC-139)"
            } else {
              Write-Host "::error::expected-migrations.txt not found at $migrationListFile."
              Write-Host "::error::This file is generated during the build step. Ensure the build includes the migration list generation step (DEC-139)."
              throw "expected-migrations.txt not found — cannot verify database migrations."
            }

            $pending = @()
            foreach ($m in $expected) {
              if ($applied -notcontains $m) { $pending += $m }
            }

            if ($pending.Count -gt 0) {
              Write-Host ""
              Write-Host "::error::$($pending.Count) PENDING migration(s) detected in PRODUCTION [$dbName]!"
              foreach ($m in $pending) {
                Write-Host "::error::  PENDING: $m"
              }
              Write-Host ""
              Write-Host "::error::REMEDIATION:"
              Write-Host "::error::  1. Run the 'Apply PRODUCTION Migrations' workflow first."
              Write-Host "::error::  2. Or apply migrations manually using SSMS/sqlcmd with a DBA account."
              Write-Host "::error::  3. Re-run this deployment after migrations are applied."
              Write-Host "::error::  See: docs/DEPLOYMENT_CHECKLIST.md"
              throw "DEPLOYMENT BLOCKED: $($pending.Count) pending EF Core migration(s) in PRODUCTION [$dbName]. Apply migrations before deploying."
            }

            Write-Host "::notice::All $($expected.Count) expected EF Core migrations are applied in PRODUCTION [$dbName]."
          } catch {
            if ($_.Exception.Message -match "DEPLOYMENT BLOCKED|CRITICAL SAFETY CHECK") { throw }
            Write-Host "::warning::Migration check failed: $_"
            Write-Host "::warning::The deployment will continue, but the API may fail to start if migrations are pending."
          }

      # --- Start PRODUCTION IIS App Pools ---
      - name: Start Production IIS App Pools
        if: always()
        shell: pwsh
        run: |
          Import-Module WebAdministration

          $apiPool = "${{ vars.IIS_API_APPPOOL }}"
          $webPool = "${{ vars.IIS_WEB_APPPOOL }}"

          foreach ($pool in @($apiPool, $webPool)) {
            try {
              $state = (Get-WebAppPoolState -Name $pool).Value
              if ($state -ne "Started") {
                Write-Host "Starting App Pool: $pool"
                Start-WebAppPool -Name $pool
              } else {
                Write-Host "App Pool '$pool' is already Started"
              }
            } catch {
              Write-Host "::error::Failed to start App Pool '$pool': $_"
            }
          }

          # Verify final state
          Start-Sleep -Seconds 3
          foreach ($pool in @($apiPool, $webPool)) {
            try {
              $state = (Get-WebAppPoolState -Name $pool).Value
              Write-Host "App Pool '$pool' final state: $state"
            } catch {
              Write-Host "::error::Could not read state for App Pool '$pool': $_"
            }
          }

      # --- Smoke Test ---
      - name: Smoke test - API health check
        shell: pwsh
        run: |
          # Wait for IIS worker processes to initialize and migrations to run
          Start-Sleep -Seconds 15

          $healthUrl = "${{ vars.PROD_API_HEALTH_URL }}"
          Write-Host "Smoke test URL: $healthUrl"

          try {
            $response = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 60
            $statusCode = $response.StatusCode

            if ($statusCode -eq 200) {
              Write-Host "::notice::Smoke test PASSED (HTTP $statusCode)"
              Write-Host "Response length: $($response.Content.Length) bytes"
            } else {
              Write-Host "::warning::Smoke test returned unexpected status code: $statusCode"
            }
          } catch {
            Write-Host "::error::Smoke test FAILED: $_"
            Write-Host "::error::The API may need additional time to start, or a migration may have failed."
            Write-Host "::error::Check the application event log on AOVIA1VMS011 for startup errors."
            Write-Host "::error::Health URL: $healthUrl"
            throw "Smoke test failed — check server logs for database migration or startup errors."
          }

      # --- Verify Test Environment Not Impacted ---
      - name: Verify Test environment integrity
        if: always()
        shell: pwsh
        run: |
          Import-Module WebAdministration

          # Check Test App Pools are still running
          $testPools = @("AlplaPortal-Test-Api-Pool", "AlplaPortal-Test-Web-Pool")
          foreach ($pool in $testPools) {
            try {
              $state = (Get-WebAppPoolState -Name $pool).Value
              Write-Host "Test pool '$pool' state: $state"
              if ($state -ne "Started") {
                Write-Host "::warning::Test pool '$pool' is not running! State: $state"
              }
            } catch {
              Write-Host "::warning::Could not check Test pool '$pool': $_"
            }
          }

      # --- Summary ---
      - name: Deployment summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "============================================="
          Write-Host "  PRODUCTION Deployment Summary"
          Write-Host "============================================="
          Write-Host "Version:      ${{ inputs.version }}"
          Write-Host "Environment:  PRODUCTION"
          Write-Host "API Path:     ${{ vars.API_DEPLOY_PATH }}"
          Write-Host "Web Path:     ${{ vars.WEB_DEPLOY_PATH }}"
          Write-Host "API Pool:     ${{ vars.IIS_API_APPPOOL }}"
          Write-Host "Web Pool:     ${{ vars.IIS_WEB_APPPOOL }}"
          Write-Host "Health URL:   ${{ vars.PROD_API_HEALTH_URL }}"
          Write-Host "Database:     [Portal-Gerencial]"
          Write-Host "API Port:     5002"
          Write-Host "============================================="
          Write-Host ""
          Write-Host "If pending migrations are detected, this workflow will BLOCK"
          Write-Host "startup. Run 'Apply PRODUCTION Migrations' workflow first."
          Write-Host "See: docs/DEPLOYMENT_CHECKLIST.md"
          Write-Host "============================================="
