# =============================================================================
# Alpla Angola - Portal Gerencial
# GitHub Actions Workflow: Deploy to TEST Environment
# =============================================================================
#
# Target Server: AOVIA1VMS011
# Target Environment: TEST
# Official URL: https://portalgerencial-test.alpla.net/
# API Port: 5001 (NOT 5000 — port 5000 is reserved by another application)
#
# This workflow builds the backend (.NET 8) and frontend (React/Vite),
# then deploys both to the TEST environment on the self-hosted runner.
#
# IMPORTANT:
# - This workflow does NOT touch Production.
# - This workflow does NOT run EF database migrations.
#   Use the 'Apply TEST Migrations' workflow instead (DEC-139).
# - This workflow does NOT commit or expose any secrets.
#
# EF Core migration checks run BEFORE starting App Pools (DEC-137).
# The expected migration list is auto-generated from the migrations
# folder and packaged with the build artifact (DEC-139).
# =============================================================================

name: Deploy to TEST

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v2.154.0)'
        required: true
        type: string

# Prevent concurrent deployments to TEST
concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Job 1: Build
  # ===========================================================================
  # Compiles backend and frontend on a GitHub-hosted runner, then uploads
  # the artifacts for the deploy job.
  # ===========================================================================
  build:
    name: Build (${{ inputs.version }})
    runs-on: windows-latest
    timeout-minutes: 20

    outputs:
      build_id: ${{ steps.meta.outputs.build_id }}
      version: ${{ steps.meta.outputs.version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}

    steps:
      # --- Checkout ---
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Validate version consistency & compute canonical build metadata ---
      # The authoritative version is docs/CHANGELOG.md ("Current Version"); docs/VERSION.md and
      # src/frontend/src/config.ts must agree. The manual workflow input is a CONFIRMATION only and
      # must equal the repository version. Any missing/malformed/inconsistent value fails the build
      # (never silently corrected). buildId = <version>+<shortSha> (environment-independent).
      - name: Validate version and compute build metadata
        id: meta
        shell: pwsh
        run: |
          function Get-CurrentVersion($text) {
            if ($text -match '(?ms)Current Version\s*\r?\n\s*\r?\n\s*v?([0-9]+\.[0-9]+\.[0-9]+)') { return $Matches[1] }
            return $null
          }
          $changelog = Get-Content docs/CHANGELOG.md -Raw
          $versionMd = Get-Content docs/VERSION.md -Raw
          $configTs  = Get-Content src/frontend/src/config.ts -Raw

          $chVer = Get-CurrentVersion $changelog
          $vmVer = Get-CurrentVersion $versionMd
          $cfgVer = $null
          if ($configTs -match "APP_VERSION\s*=\s*'v?([0-9]+\.[0-9]+\.[0-9]+)'") { $cfgVer = $Matches[1] }

          $inputVer = "${{ inputs.version }}".Trim().TrimStart('v')

          if ([string]::IsNullOrWhiteSpace($chVer)) { throw "Could not read 'Current Version' from docs/CHANGELOG.md" }
          if ($chVer -ne $vmVer)  { throw "Version inconsistency: CHANGELOG=$chVer but VERSION.md=$vmVer" }
          if ($chVer -ne $cfgVer) { throw "Version inconsistency: CHANGELOG=$chVer but config.ts=$cfgVer" }
          if ([string]::IsNullOrWhiteSpace($inputVer)) { throw "Workflow version input is required." }
          if ($inputVer -ne $chVer) { throw "Workflow input ($inputVer) does not match repository version ($chVer). Aborting." }

          $shortSha = "${{ github.sha }}".Substring(0,7)
          $buildId  = "$chVer+$shortSha"
          $builtAt  = [DateTime]::UtcNow.ToString("o")

          Write-Host "::notice::Validated version $chVer; buildId=$buildId"
          "version=$chVer"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "short_sha=$shortSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "build_id=$buildId"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "built_at=$builtAt"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # --- Backend (.NET 8) ---
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend dependencies
        run: dotnet restore src/backend/AlplaPortal.sln

      - name: Build backend (Release)
        run: dotnet build src/backend/AlplaPortal.sln --configuration Release --no-restore

      - name: Publish backend API
        run: >
          dotnet publish src/backend/AlplaPortal.Api/AlplaPortal.Api.csproj
          --configuration Release
          --no-build
          --output ${{ github.workspace }}/artifacts/api

      # --- Frontend (React + Vite) ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Frontend type check
        working-directory: src/frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: src/frontend
        env:
          # Compile the canonical build identity into the bundle (public, non-secret). NEVER put
          # secrets in VITE_* — they are visible in the browser.
          VITE_APP_VERSION: ${{ steps.meta.outputs.version }}
          VITE_APP_BUILD_ID: ${{ steps.meta.outputs.build_id }}
          VITE_APP_SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          VITE_APP_BUILT_AT: ${{ steps.meta.outputs.built_at }}
        run: npm run build

      - name: Copy frontend dist to artifact folder
        shell: pwsh
        run: |
          $source = "src/frontend/dist"
          $destination = "${{ github.workspace }}/artifacts/web"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          robocopy $source $destination /E /NFL /NDL /NJH /NJS /NC /NS /NP
          if ($LASTEXITCODE -gt 7) { throw "Frontend dist copy failed with robocopy exit code $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

      - name: Validate frontend artifact structure
        shell: pwsh
        run: |
          $assetsDir = "${{ github.workspace }}/artifacts/web/assets"
          if (-not (Test-Path $assetsDir)) {
            throw "FATAL: artifacts/web/assets/ directory is missing. Vite build output was not preserved correctly."
          }
          $jsFiles = Get-ChildItem -Path $assetsDir -Filter "*.js" -ErrorAction SilentlyContinue
          $cssFiles = Get-ChildItem -Path $assetsDir -Filter "*.css" -ErrorAction SilentlyContinue
          if (-not $jsFiles) { throw "FATAL: No .js files found in artifacts/web/assets/" }
          if (-not $cssFiles) { throw "FATAL: No .css files found in artifacts/web/assets/" }
          Write-Host "Frontend artifact structure validated:"
          Write-Host "  JS files: $($jsFiles.Count)"
          Write-Host "  CSS files: $($cssFiles.Count)"

      # --- Build manifest + public frontend metadata (canonical build identity) ---
      # ONE object, written into BOTH artifacts so the deploy job can prove FE and BE were built from
      # the same source (buildId equality). The backend reads build-manifest.json at startup; the web
      # copy of build-metadata.json is served (no-cache) for live deploy verification. Deploy-time
      # fields (environment, deploymentId, run IDs) are appended to the API manifest during deploy.
      - name: Generate build manifest and frontend metadata
        shell: pwsh
        run: |
          $manifest = [ordered]@{
            version    = "${{ steps.meta.outputs.version }}"
            gitSha     = "${{ github.sha }}"
            shortSha   = "${{ steps.meta.outputs.short_sha }}"
            buildId    = "${{ steps.meta.outputs.build_id }}"
            builtAtUtc = "${{ steps.meta.outputs.built_at }}"
          }
          $json = $manifest | ConvertTo-Json -Depth 5
          $json | Set-Content -Path "${{ github.workspace }}/artifacts/api/build-manifest.json" -Encoding UTF8
          $json | Set-Content -Path "${{ github.workspace }}/artifacts/web/build-manifest.json" -Encoding UTF8
          $json | Set-Content -Path "${{ github.workspace }}/artifacts/web/build-metadata.json" -Encoding UTF8
          Write-Host "::notice::Build manifest written to both artifacts (buildId=${{ steps.meta.outputs.build_id }})"

      # --- Generate Expected Migration List (DEC-139) ---
      - name: Generate expected migration list
        shell: pwsh
        run: |
          $migrationsPath = "src/backend/AlplaPortal.Infrastructure/Data/Migrations"
          $outputFile = "${{ github.workspace }}/artifacts/api/expected-migrations.txt"
          $migrations = Get-ChildItem -Path $migrationsPath -Filter "*.cs" -Name |
            Where-Object { $_ -notmatch '\.Designer\.cs$' -and $_ -notmatch 'Snapshot\.cs$' } |
            ForEach-Object { $_ -replace '\.cs$', '' } |
            Sort-Object
          $migrations | Set-Content -Path $outputFile -Encoding UTF8
          Write-Host "Generated expected-migrations.txt with $($migrations.Count) migrations"

      # --- Artifact integrity (SHA-256) ---
      # Deterministic folder hash (sorted <relPath> <fileHash> lines) over the FINAL artifact contents,
      # excluding the hash file itself. Written INTO each artifact as artifact-sha256.txt so the expected
      # value travels with the artifact and the self-hosted runner re-hashes and compares before touching
      # the live server. This is a SEPARATE control from manifest-equality (binary integrity vs identity).
      - name: Compute artifact SHA-256
        shell: pwsh
        run: |
          function Get-FolderSha256($path) {
            $root = (Resolve-Path $path).Path.TrimEnd('\')
            $files = Get-ChildItem -LiteralPath $root -Recurse -File | Where-Object { $_.Name -ne 'artifact-sha256.txt' }
            $lines = foreach ($f in $files) {
              $rel = $f.FullName.Substring($root.Length).TrimStart('\').Replace('\','/').ToLowerInvariant()
              $h = (Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$rel $h"
            }
            $joined = ($lines | Sort-Object) -join "`n"
            $bytes = [System.Text.Encoding]::UTF8.GetBytes($joined)
            $sha = [System.Security.Cryptography.SHA256]::Create()
            return ([BitConverter]::ToString($sha.ComputeHash($bytes)) -replace '-','').ToLowerInvariant()
          }
          $apiSha = Get-FolderSha256 "${{ github.workspace }}/artifacts/api"
          $webSha = Get-FolderSha256 "${{ github.workspace }}/artifacts/web"
          $apiSha | Set-Content -Path "${{ github.workspace }}/artifacts/api/artifact-sha256.txt" -Encoding ascii -NoNewline
          $webSha | Set-Content -Path "${{ github.workspace }}/artifacts/web/artifact-sha256.txt" -Encoding ascii -NoNewline
          Write-Host "::notice::apiArtifactSha256=$apiSha"
          Write-Host "::notice::webArtifactSha256=$webSha"

      # --- Upload Artifacts ---
      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-artifact
          path: ${{ github.workspace }}/artifacts/api
          retention-days: 7
          if-no-files-found: error

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-artifact
          path: ${{ github.workspace }}/artifacts/web
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # Job 2: Deploy to TEST
  # ===========================================================================
  # Downloads artifacts on the self-hosted runner, backs up current files,
  # stops IIS, deploys new files, starts IIS, and runs a smoke test.
  #
  # EF Core migrations are applied via the 'Apply TEST Migrations' workflow
  # (DEC-139). This job checks for pending migrations and blocks startup
  # if any are found (DEC-137).
  # ===========================================================================
  deploy-test:
    name: Deploy TEST (${{ inputs.version }})
    needs: build
    runs-on: [self-hosted, Windows, X64, iis, test, alpla-portal-test]
    # Raised from 15 to 45 min: this self-hosted runner has very low egress
    # throughput to the GitHub/Azure Blob artifact backend (~0.6 Mbit/s measured),
    # so downloading the ~121 MB api-artifact alone can exceed the old 15 min budget
    # and the job was being cancelled mid-download. This does NOT fix the network;
    # it only stops the premature cancellation while the slow link is investigated.
    timeout-minutes: 45
    environment: test

    env:
      ARTIFACT_API_PATH: C:\ActionsArtifacts\AlplaPortal\api
      ARTIFACT_WEB_PATH: C:\ActionsArtifacts\AlplaPortal\web

    steps:
      # --- Fail-fast: required deployment variables (before ANY server-touching work) ---
      - name: Validate deployment variables
        shell: pwsh
        run: |
          $portal = "${{ vars.TEST_PORTAL_URL }}"
          if ([string]::IsNullOrWhiteSpace($portal)) { throw "Repository variable TEST_PORTAL_URL is not set (expected https://portalgerencial-test.alpla.net)." }
          if ($portal -notmatch '^https://') { throw "TEST_PORTAL_URL must be an https:// URL. Got: $portal" }
          if ($portal -match '(?i)^https://portalgerencial\.alpla\.net') { throw "TEST_PORTAL_URL points to PRODUCTION — aborting to prevent a cross-environment deploy." }
          if ($portal -notmatch '(?i)portalgerencial-test\.alpla\.net') { throw "TEST_PORTAL_URL does not match the TEST host (expected https://portalgerencial-test.alpla.net). Got: $portal" }
          Write-Host "::notice::TEST_PORTAL_URL validated: $portal"

      # --- Download Artifacts ---
      - name: Clean artifact staging directories
        shell: pwsh
        run: |
          if (Test-Path "${{ env.ARTIFACT_API_PATH }}") {
            Remove-Item -Path "${{ env.ARTIFACT_API_PATH }}" -Recurse -Force
          }
          if (Test-Path "${{ env.ARTIFACT_WEB_PATH }}") {
            Remove-Item -Path "${{ env.ARTIFACT_WEB_PATH }}" -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path "${{ env.ARTIFACT_API_PATH }}" | Out-Null
          New-Item -ItemType Directory -Force -Path "${{ env.ARTIFACT_WEB_PATH }}" | Out-Null

      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-artifact
          path: ${{ env.ARTIFACT_API_PATH }}

      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-artifact
          path: ${{ env.ARTIFACT_WEB_PATH }}

      # --- GATE: build identity (FE == BE == expected) — runs BEFORE any server mutation ---
      - name: Verify build manifests (frontend == backend == expected)
        shell: pwsh
        run: |
          $expected = "${{ needs.build.outputs.build_id }}"
          $apiManifest = Join-Path "${{ env.ARTIFACT_API_PATH }}" "build-manifest.json"
          $webManifest = Join-Path "${{ env.ARTIFACT_WEB_PATH }}" "build-manifest.json"
          foreach ($m in @($apiManifest, $webManifest)) {
            if (-not (Test-Path $m)) { throw "FATAL: build manifest missing ($m). Deployment metadata invalid — aborting fail-closed." }
          }
          $api = Get-Content $apiManifest -Raw | ConvertFrom-Json
          $web = Get-Content $webManifest -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($api.buildId)) { throw "FATAL: API manifest has no buildId (malformed)." }
          if ($api.buildId -ne $web.buildId) { throw "FATAL: build identity mismatch api=$($api.buildId) web=$($web.buildId). Aborting before touching the server." }
          if ($expected -and $api.buildId -ne $expected) { throw "FATAL: artifact buildId ($($api.buildId)) != expected ($expected). Aborting." }
          Write-Host "::notice::Build identity verified: $($api.buildId)"

      # --- GATE: artifact integrity (SHA-256) — before any server mutation ---
      # Re-hashes the downloaded artifacts and compares to artifact-sha256.txt shipped in each. Detects a
      # corrupt/incomplete download BEFORE pools are stopped or files replaced. Separate control from the
      # manifest-equality (identity) gate above.
      - name: Verify artifact SHA-256 (integrity)
        shell: pwsh
        run: |
          function Get-FolderSha256($path) {
            $root = (Resolve-Path $path).Path.TrimEnd('\')
            $files = Get-ChildItem -LiteralPath $root -Recurse -File | Where-Object { $_.Name -ne 'artifact-sha256.txt' }
            $lines = foreach ($f in $files) {
              $rel = $f.FullName.Substring($root.Length).TrimStart('\').Replace('\','/').ToLowerInvariant()
              $h = (Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$rel $h"
            }
            $joined = ($lines | Sort-Object) -join "`n"
            $bytes = [System.Text.Encoding]::UTF8.GetBytes($joined)
            $sha = [System.Security.Cryptography.SHA256]::Create()
            return ([BitConverter]::ToString($sha.ComputeHash($bytes)) -replace '-','').ToLowerInvariant()
          }
          function Confirm-Artifact($path, $label) {
            $expectedFile = Join-Path $path "artifact-sha256.txt"
            if (-not (Test-Path $expectedFile)) { throw "artifact-sha256.txt missing in $label ($path) — cannot verify integrity." }
            $expected = (Get-Content $expectedFile -Raw).Trim()
            $actual = Get-FolderSha256 $path
            Write-Host "${label}: expected=$expected actual=$actual"
            if ($expected -ne $actual) { throw "ARTIFACT INTEGRITY FAILURE ($label): expected $expected, actual $actual. Aborting before touching the server." }
          }
          Confirm-Artifact "${{ env.ARTIFACT_API_PATH }}" "api"
          Confirm-Artifact "${{ env.ARTIFACT_WEB_PATH }}" "web"
          Write-Host "::notice::Artifact SHA-256 verified (api + web)."

      # --- GATE: database readiness + pending EF Core migrations (DEC-137/DEC-139) ---
      # Runs BEFORE stopping pools or replacing files. A failure here aborts with the PREVIOUS version
      # still live (pools never stopped) — the corrected activation order (no new code against an
      # un-migrated schema). Connection string comes from the server's preserved appsettings.Test.json;
      # the expected list comes from the downloaded artifact.
      - name: Verify database migration readiness
        shell: pwsh
        run: |
          $apiDeploy = "${{ vars.API_DEPLOY_PATH }}"
          $configFile = Join-Path $apiDeploy "appsettings.Test.json"
          if (-not (Test-Path $configFile)) { throw "appsettings.Test.json not found at $configFile — cannot verify migrations." }
          $connStr = (Get-Content $configFile -Raw | ConvertFrom-Json).ConnectionStrings.DefaultConnection
          if ([string]::IsNullOrWhiteSpace($connStr)) { throw "DefaultConnection empty in appsettings.Test.json." }

          $migrationListFile = Join-Path "${{ env.ARTIFACT_API_PATH }}" "expected-migrations.txt"
          if (-not (Test-Path $migrationListFile)) { throw "expected-migrations.txt not found in artifact (DEC-139)." }
          $expected = Get-Content $migrationListFile | Where-Object { $_ -match '\S' } | ForEach-Object { $_.Trim() }

          $conn = New-Object System.Data.SqlClient.SqlConnection($connStr)
          $conn.Open()
          $dbName = (New-Object System.Data.SqlClient.SqlCommand("SELECT DB_NAME()", $conn)).ExecuteScalar()
          Write-Host "Connected to [$dbName]; $($expected.Count) expected migrations."
          $cmd = $conn.CreateCommand(); $cmd.CommandText = "SELECT MigrationId FROM __EFMigrationsHistory ORDER BY MigrationId"
          $reader = $cmd.ExecuteReader(); $applied = @(); while ($reader.Read()) { $applied += $reader["MigrationId"].ToString() }; $reader.Close(); $conn.Close()

          $pending = @(); foreach ($m in $expected) { if ($applied -notcontains $m) { $pending += $m } }
          if ($pending.Count -gt 0) {
            foreach ($m in $pending) { Write-Host "::error::PENDING migration: $m" }
            throw "DEPLOYMENT BLOCKED: $($pending.Count) pending migration(s) in [$dbName]. Run 'Apply TEST Migrations' first. The previous version remains live."
          }
          Write-Host "::notice::All $($expected.Count) expected migrations are applied in [$dbName]."

      # --- Backup ---
      - name: Create timestamped backup
        shell: pwsh
        run: |
          $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
          $backupDir = Join-Path "${{ vars.BACKUP_PATH }}" "backup_$timestamp"
          New-Item -ItemType Directory -Force -Path $backupDir | Out-Null

          Write-Host "::notice::Backup directory: $backupDir"

          # Backup current API folder
          $apiDeploy = "${{ vars.API_DEPLOY_PATH }}"
          if (Test-Path $apiDeploy) {
            $apiBackup = Join-Path $backupDir "api"
            Write-Host "Backing up API from $apiDeploy to $apiBackup"
            robocopy $apiDeploy $apiBackup /E /NFL /NDL /NJH /NJS /NC /NS /NP
            # Robocopy exit codes 0-7 are success
            if ($LASTEXITCODE -gt 7) { throw "API backup failed with robocopy exit code $LASTEXITCODE" }
          } else {
            Write-Host "::warning::API deploy path does not exist yet. Skipping API backup."
          }

          # Backup current Web folder
          $webDeploy = "${{ vars.WEB_DEPLOY_PATH }}"
          if (Test-Path $webDeploy) {
            $webBackup = Join-Path $backupDir "web"
            Write-Host "Backing up Web from $webDeploy to $webBackup"
            robocopy $webDeploy $webBackup /E /NFL /NDL /NJH /NJS /NC /NS /NP
            if ($LASTEXITCODE -gt 7) { throw "Web backup failed with robocopy exit code $LASTEXITCODE" }
          } else {
            Write-Host "::warning::Web deploy path does not exist yet. Skipping Web backup."
          }

          # Reset exit code so the step doesn't fail on robocopy success codes 1-7
          $global:LASTEXITCODE = 0

      # --- Stop IIS App Pools ---
      - name: Stop IIS App Pools
        shell: pwsh
        run: |
          Import-Module WebAdministration

          $apiPool = "${{ vars.IIS_API_APPPOOL }}"
          $webPool = "${{ vars.IIS_WEB_APPPOOL }}"

          foreach ($pool in @($apiPool, $webPool)) {
            $state = (Get-WebAppPoolState -Name $pool).Value
            if ($state -eq "Started") {
              Write-Host "Stopping App Pool: $pool"
              Stop-WebAppPool -Name $pool
            } else {
              Write-Host "App Pool '$pool' is already in state: $state"
            }
          }

          # Wait for pools to fully stop
          Start-Sleep -Seconds 5

          foreach ($pool in @($apiPool, $webPool)) {
            $state = (Get-WebAppPoolState -Name $pool).Value
            Write-Host "App Pool '$pool' state after stop: $state"
          }

      # --- Deploy API ---
      - name: Deploy API files
        shell: pwsh
        run: |
          $apiSource = "${{ env.ARTIFACT_API_PATH }}"
          $apiDeploy = "${{ vars.API_DEPLOY_PATH }}"

          # Ensure deploy directory exists
          if (-not (Test-Path $apiDeploy)) {
            New-Item -ItemType Directory -Force -Path $apiDeploy | Out-Null
          }

          # ---------------------------------------------------------------
          # Preserve environment-specific configuration files on the server.
          # These files contain server-side secrets and environment config
          # that must NOT be overwritten by the build artifact.
          # ---------------------------------------------------------------
          $configFilesToPreserve = @(
            "appsettings.Staging.json",
            "appsettings.Test.json",
            "appsettings.Production.json",
            "appsettings.Local.json"
          )

          $tempConfigDir = Join-Path $env:TEMP "AlplaPortal_ConfigBackup_API"
          if (Test-Path $tempConfigDir) { Remove-Item -Path $tempConfigDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $tempConfigDir | Out-Null

          # Save existing config files
          $preservedFiles = @()
          foreach ($configFile in $configFilesToPreserve) {
            $sourcePath = Join-Path $apiDeploy $configFile
            if (Test-Path $sourcePath) {
              Copy-Item -Path $sourcePath -Destination $tempConfigDir -Force
              $preservedFiles += $configFile
              Write-Host "Preserved: $configFile"
            }
          }

          # Deploy new API files (overwrite existing, add new, but do NOT mirror/delete)
          Write-Host "Deploying API files from $apiSource to $apiDeploy"
          robocopy $apiSource $apiDeploy /E /IS /IT /NFL /NDL /NJH /NJS /NC /NS /NP
          if ($LASTEXITCODE -gt 7) { throw "API deployment failed with robocopy exit code $LASTEXITCODE" }

          # Restore preserved config files (overwrite whatever the artifact brought)
          foreach ($configFile in $preservedFiles) {
            $backupPath = Join-Path $tempConfigDir $configFile
            $targetPath = Join-Path $apiDeploy $configFile
            Copy-Item -Path $backupPath -Destination $targetPath -Force
            Write-Host "Restored: $configFile"
          }

          # Cleanup temp
          Remove-Item -Path $tempConfigDir -Recurse -Force -ErrorAction SilentlyContinue

          # Reset exit code
          $global:LASTEXITCODE = 0

      # --- Deploy Web ---
      - name: Deploy Web files
        shell: pwsh
        run: |
          $webSource = "${{ env.ARTIFACT_WEB_PATH }}"
          $webDeploy = "${{ vars.WEB_DEPLOY_PATH }}"

          # Ensure deploy directory exists
          if (-not (Test-Path $webDeploy)) {
            New-Item -ItemType Directory -Force -Path $webDeploy | Out-Null
          }

          # ---------------------------------------------------------------
          # Preserve the server-side web.config (IIS SPA rewrite rules)
          # if the build artifact does not include one.
          # ---------------------------------------------------------------
          $serverWebConfig = Join-Path $webDeploy "web.config"
          $artifactWebConfig = Join-Path $webSource "web.config"
          $preserveWebConfig = $false
          $tempWebConfig = Join-Path $env:TEMP "AlplaPortal_WebConfig_Backup_web.config"

          if ((Test-Path $serverWebConfig) -and (-not (Test-Path $artifactWebConfig))) {
            Copy-Item -Path $serverWebConfig -Destination $tempWebConfig -Force
            $preserveWebConfig = $true
            Write-Host "Preserved server-side web.config (not present in artifact)"
          }

          # Deploy new Web files
          Write-Host "Deploying Web files from $webSource to $webDeploy"
          robocopy $webSource $webDeploy /MIR /NFL /NDL /NJH /NJS /NC /NS /NP
          if ($LASTEXITCODE -gt 7) { throw "Web deployment failed with robocopy exit code $LASTEXITCODE" }

          # Restore preserved web.config
          if ($preserveWebConfig -and (Test-Path $tempWebConfig)) {
            Copy-Item -Path $tempWebConfig -Destination $serverWebConfig -Force
            Write-Host "Restored server-side web.config"
            Remove-Item -Path $tempWebConfig -Force -ErrorAction SilentlyContinue
          }

          # Reset exit code
          $global:LASTEXITCODE = 0

      # --- GATE: web.config cache policy present (fail-closed, before activation) ---
      # TEST uses the artifact web.config, which ships the cache <location> blocks. This verifies they are
      # actually present in the deployed file so a regression cannot silently ship without the no-cache
      # index.html / immutable assets policy.
      - name: Verify web.config cache policy
        shell: pwsh
        run: |
          $webConfig = Join-Path "${{ vars.WEB_DEPLOY_PATH }}" "web.config"
          if (-not (Test-Path $webConfig)) { throw "web.config not found at $webConfig." }
          [xml]$xml = Get-Content $webConfig
          $req = @{ 'index.html' = 'no-cache'; 'build-metadata.json' = 'no-cache'; 'assets' = 'immutable' }
          foreach ($p in $req.Keys) {
            $loc = @($xml.configuration.location) | Where-Object { $_.path -eq $p }
            if (-not $loc) { throw "web.config is missing the cache <location path='$p'> block." }
            $add = @($loc.'system.webServer'.httpProtocol.customHeaders.add) | Where-Object { $_.name -eq 'Cache-Control' } | Select-Object -First 1
            if (-not $add -or ($add.value -notmatch [regex]::Escape($req[$p]))) { throw "web.config Cache-Control for '$p' is missing or incorrect (expected to contain '$($req[$p])')." }
          }
          Write-Host "::notice::web.config cache policy verified (index.html + build-metadata.json no-cache; assets immutable)."

      # --- Stamp deployment-time metadata into the deployed backend manifest ---
      # Migration readiness was already validated BEFORE pools were stopped (see the gate above), so
      # there is no post-deploy migration check here — activation cannot proceed against an un-migrated
      # schema. This step records deployment identity for the version endpoint and audit.
      - name: Write deployment metadata
        shell: pwsh
        run: |
          $manifestPath = Join-Path "${{ vars.API_DEPLOY_PATH }}" "build-manifest.json"
          if (-not (Test-Path $manifestPath)) { throw "build-manifest.json not found in deployed API folder." }
          $m = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $m | Add-Member -NotePropertyName environment -NotePropertyValue "TEST" -Force
          $m | Add-Member -NotePropertyName deploymentId -NotePropertyValue "${{ github.run_id }}-${{ github.run_attempt }}" -Force
          $m | Add-Member -NotePropertyName githubRunId -NotePropertyValue "${{ github.run_id }}" -Force
          $m | Add-Member -NotePropertyName githubRunNumber -NotePropertyValue "${{ github.run_number }}" -Force
          $m | Add-Member -NotePropertyName githubRunAttempt -NotePropertyValue "${{ github.run_attempt }}" -Force
          $m | Add-Member -NotePropertyName deploymentStartedAtUtc -NotePropertyValue ([DateTime]::UtcNow.ToString("o")) -Force
          $m | ConvertTo-Json -Depth 5 | Set-Content -Path $manifestPath -Encoding UTF8
          Write-Host "::notice::Deployment metadata written (deploymentId=${{ github.run_id }}-${{ github.run_attempt }})"

      # --- Start IIS App Pools (ACTIVATION) ---
      # Activation is CONDITIONAL on every prior gate passing (if: success()). It deliberately does NOT
      # use if: always() — new code must never be activated after a failed migration/metadata/deploy
      # gate. Availability recovery is a separate, clearly-scoped step below.
      - name: Start IIS App Pools
        if: success()
        shell: pwsh
        run: |
          Import-Module WebAdministration

          $apiPool = "${{ vars.IIS_API_APPPOOL }}"
          $webPool = "${{ vars.IIS_WEB_APPPOOL }}"

          foreach ($pool in @($apiPool, $webPool)) {
            try {
              $state = (Get-WebAppPoolState -Name $pool).Value
              if ($state -ne "Started") {
                Write-Host "Starting App Pool: $pool"
                Start-WebAppPool -Name $pool
              } else {
                Write-Host "App Pool '$pool' is already Started"
              }
            } catch {
              Write-Host "::error::Failed to start App Pool '$pool': $_"
            }
          }

          # Verify final state
          Start-Sleep -Seconds 3
          foreach ($pool in @($apiPool, $webPool)) {
            try {
              $state = (Get-WebAppPoolState -Name $pool).Value
              Write-Host "App Pool '$pool' final state: $state"
            } catch {
              Write-Host "::error::Could not read state for App Pool '$pool': $_"
            }
          }

      # --- Smoke Test ---
      - name: Smoke test - API health check
        shell: pwsh
        run: |
          # Wait for IIS worker processes to initialize
          Start-Sleep -Seconds 10

          $healthUrl = "${{ vars.TEST_API_HEALTH_URL }}"
          Write-Host "Smoke test URL: $healthUrl"

          try {
            $response = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 30
            $statusCode = $response.StatusCode

            if ($statusCode -eq 200) {
              Write-Host "::notice::Smoke test PASSED (HTTP $statusCode)"
              Write-Host "Response length: $($response.Content.Length) bytes"
            } else {
              Write-Host "::warning::Smoke test returned unexpected status code: $statusCode"
            }
          } catch {
            Write-Host "::error::Smoke test FAILED: $_"
            Write-Host "::error::The API may need additional time to start, or there may be a configuration issue."
            Write-Host "::error::Health URL: $healthUrl"
            throw "Smoke test failed"
          }

      # --- Verify running build identity (API + frontend == expected) ---
      # A green /health is not enough: confirm the RUNNING API and the deployed frontend both report
      # the exact buildId produced by this workflow. Fails the deployment on any mismatch or on a
      # non-Valid backend metadata status.
      - name: Verify running build identity
        shell: pwsh
        run: |
          $expected = "${{ needs.build.outputs.build_id }}"
          $portal = "${{ vars.TEST_PORTAL_URL }}"
          if ([string]::IsNullOrWhiteSpace($portal)) {
            $h = "${{ vars.TEST_API_HEALTH_URL }}"
            if ($h -match '^(https?://[^/]+)') { $b = $Matches[1] } else { $b = "" }
            if ($b -and ($b -notmatch 'localhost')) { $portal = $b }
          }
          if ([string]::IsNullOrWhiteSpace($portal)) {
            throw "Cannot verify build identity: set repository variable TEST_PORTAL_URL (e.g. https://portalgerencial-test.alpla.net)."
          }
          $portal = $portal.TrimEnd('/')
          Start-Sleep -Seconds 3

          $apiVer = Invoke-RestMethod -Uri "$portal/api/app/version" -TimeoutSec 30
          Write-Host "API   : buildId=$($apiVer.buildId) status=$($apiVer.buildMetadataStatus)"
          if ($apiVer.buildMetadataStatus -ne 'Valid') { throw "API build metadata status is '$($apiVer.buildMetadataStatus)' (expected Valid)." }
          if ($apiVer.buildId -ne $expected) { throw "API buildId '$($apiVer.buildId)' != expected '$expected'." }

          $fe = Invoke-RestMethod -Uri "$portal/build-metadata.json" -Headers @{ 'Cache-Control' = 'no-cache' } -TimeoutSec 30
          Write-Host "Front : buildId=$($fe.buildId)"
          if ($fe.buildId -ne $expected) { throw "Frontend buildId '$($fe.buildId)' != expected '$expected'." }
          if ($fe.buildId -ne $apiVer.buildId) { throw "Frontend/API buildId mismatch." }

          Write-Host "::notice::Live build identity verified (API == frontend == $expected)."

      # --- Availability recovery (failure only) ---
      # Activation (Start IIS App Pools) is gated on success(). If a step AFTER the pools were stopped
      # failed, this brings the site back to a running state. It is safe because migration readiness was
      # validated BEFORE the pools were stopped — recovery never activates code against an un-migrated DB.
      - name: Restore IIS App Pools (availability recovery)
        if: failure() || cancelled()
        shell: pwsh
        run: |
          Import-Module WebAdministration
          foreach ($pool in @("${{ vars.IIS_API_APPPOOL }}", "${{ vars.IIS_WEB_APPPOOL }}")) {
            try {
              if ((Get-WebAppPoolState -Name $pool).Value -ne "Started") {
                Write-Host "Recovery: starting App Pool '$pool'"
                Start-WebAppPool -Name $pool
              }
            } catch { Write-Host "::error::Recovery failed to start App Pool '$pool': $_" }
          }

      # --- Summary (success) ---
      # Only prints a "deployment completed" summary when every prior step
      # actually succeeded. Never runs on failure/cancellation, so it can no
      # longer claim a version was deployed when the job did not finish.
      - name: Deployment summary (success)
        if: success()
        shell: pwsh
        run: |
          Write-Host "============================================="
          Write-Host "  Deployment COMPLETED"
          Write-Host "============================================="
          Write-Host "Version:      ${{ inputs.version }}"
          Write-Host "Environment:  TEST"
          Write-Host "API Path:     ${{ vars.API_DEPLOY_PATH }}"
          Write-Host "Web Path:     ${{ vars.WEB_DEPLOY_PATH }}"
          Write-Host "API Pool:     ${{ vars.IIS_API_APPPOOL }}"
          Write-Host "Web Pool:     ${{ vars.IIS_WEB_APPPOOL }}"
          Write-Host "Health URL:   ${{ vars.TEST_API_HEALTH_URL }}"
          Write-Host "============================================="
          Write-Host "Version ${{ inputs.version }} is deployed and the smoke test passed."
          Write-Host "============================================="

      # --- Summary (failure / cancellation) ---
      # Runs when the job failed or was cancelled (e.g. the artifact download
      # exceeding the timeout). Makes clear the deploy did NOT complete and that
      # the IIS App Pools were only restored to their running state — no claim
      # is made that the target version was deployed.
      - name: Deployment summary (not completed)
        if: failure() || cancelled()
        shell: pwsh
        run: |
          Write-Host "============================================="
          Write-Host "  Deployment NOT COMPLETED"
          Write-Host "============================================="
          Write-Host "Environment:  TEST"
          Write-Host "Requested:    ${{ inputs.version }} (NOT confirmed deployed)"
          Write-Host "Outcome:      job ${{ job.status }} — the deployment did not finish."
          Write-Host "---------------------------------------------"
          Write-Host "The IIS App Pools were only RESTARTED/RESTORED to a running"
          Write-Host "state by the always() step. This does NOT mean the new files"
          Write-Host "were deployed. The server may be running the PREVIOUS version"
          Write-Host "or a partially-updated state."
          Write-Host "---------------------------------------------"
          Write-Host "Do NOT assume ${{ inputs.version }} is live. Review the failed"
          Write-Host "step above, then re-run the deployment once resolved."
          Write-Host "See: docs/DEPLOYMENT_CHECKLIST.md"
          Write-Host "============================================="
