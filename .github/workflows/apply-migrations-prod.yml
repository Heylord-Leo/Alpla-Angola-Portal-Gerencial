# =============================================================================
# Alpla Angola - Portal Gerencial
# GitHub Actions Workflow: Apply PRODUCTION Migrations
# =============================================================================
#
# Target Server:      AOVIA1VMS011
# Target Database:    Portal-Gerencial
# Target Environment: PRODUCTION
#
# This workflow applies pending EF Core migrations to the PRODUCTION database
# in a controlled, automated manner. It does NOT modify the application
# startup behavior or grant DDL permissions to IIS runtime users.
#
# DEC-139: Automated migration execution via GitHub Actions.
# DEC-137: Database.Migrate() remains disabled in non-Development environments.
#
# SAFETY:
# - Manual trigger only (workflow_dispatch).
# - Requires explicit YES-PROD confirmation input.
# - Validates the target database is Portal-Gerencial (NOT Portal-Gerencial-Test).
# - GitHub environment 'production' with approval gates.
# - Creates a database backup before applying changes.
# - Generates idempotent SQL via dotnet ef.
# - Validates the generated SQL covers all pending migrations.
# - Verifies __EFMigrationsHistory after application.
# - Does NOT start or stop IIS App Pools.
# - Does NOT deploy application files.
#
# IMPORTANT:
# - After this workflow succeeds, run "Deploy to PRODUCTION" to deploy the application.
# - If no pending migrations exist, the workflow exits successfully with a notice.
# =============================================================================

name: Apply PRODUCTION Migrations

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v2.186.0)'
        required: true
        type: string
      confirmation:
        description: 'Type YES-PROD to confirm production migration'
        required: true
        type: string

# Prevent concurrent migration applications
concurrency:
  group: apply-migrations-prod
  cancel-in-progress: false

jobs:
  apply-migrations:
    name: Apply PRODUCTION Migrations (${{ inputs.version }})
    runs-on: [self-hosted, Windows, X64, iis]
    # 45, not 20. The whole job must fit: checkout, SDK check, tool restore, restore/build,
    # database backup, migration application and verification. Run #28 (v2.249.8, 2026-11-03)
    # was cancelled 19 min into an SDK download, before a single database step was reached.
    timeout-minutes: 45
    environment: production

    steps:
      # --- Confirmation Gate ---
      - name: Verify confirmation input
        shell: pwsh
        run: |
          $confirmation = "${{ inputs.confirmation }}"
          if ($confirmation -ne "YES-PROD") {
            Write-Host "::error::Confirmation failed. Expected 'YES-PROD', got '$confirmation'."
            Write-Host "::error::PRODUCTION migration execution BLOCKED."
            throw "PRODUCTION migration blocked: confirmation input was not 'YES-PROD'."
          }
          Write-Host "::notice::Confirmation verified: YES-PROD"

      # --- Checkout Repository ---
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Use the .NET 8 SDK already on the runner, if there is one ---
      #
      # Same correction as the TEST job (89b80cc), never ported here. actions/setup-dotnet@v4 run
      # unconditionally with the open patch channel '8.0.x' does two network installs on EVERY run:
      # first `install-dotnet.ps1 -Runtime dotnet -Channel LTS` (the LTS channel now resolves to
      # .NET 10: run #28 installed runtime 10.0.14 on this server), then `-Channel 8.0`, which
      # resolves the newest 8.0 SDK on the CDN and DOWNLOADS it whenever that exact version is not
      # installed (8.0.427 was published; the server has up to 8.0.426). Run #28 (v2.249.8) sat in
      # that download for 19 minutes and was cancelled before any database step.
      #
      # Every backend project targets net8.0 and the repository has no global.json, so any 8.0.x
      # SDK present on the machine builds this solution and runs the pinned dotnet-ef 8.0.11. If
      # one is installed we use it and download nothing; the network stops being on the critical
      # path. The TEST job has run this way on the same runner (AOVIA1VMS011) since 2026-08-06.
      # Finding an 8.0.x SDK is not the same as using it (see the verify step below).
      #
      # Deliberately NOT falling back to the .NET 10 runtime: a runtime cannot build, and rolling a
      # net8.0 migration build forward to another SDK band is a silent substitution.
      - name: Detect installed .NET 8 SDK
        id: dotnet_probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $dotnetPath = (Get-Command dotnet -ErrorAction SilentlyContinue).Source
          if (-not $dotnetPath) {
            Write-Host "dotnet is not on the runner service PATH."
            "has_sdk8=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          Write-Host "dotnet: $dotnetPath"
          $sdks = @(dotnet --list-sdks 2>&1)
          Write-Host "Installed SDKs:"
          $sdks | ForEach-Object { Write-Host "  $_" }

          $sdk8 = $sdks | Where-Object { $_ -match '^8\.0\.' } | Select-Object -First 1
          if ($sdk8) {
            Write-Host "OK - using the installed .NET 8 SDK: $sdk8"
            "has_sdk8=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            Write-Host "No 8.0.x SDK found; setup-dotnet will install one."
            "has_sdk8=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      # Fallback only. Runs when the runner genuinely has no .NET 8 SDK, with the full 45-minute
      # job budget to complete the download.
      - name: Setup .NET 8 SDK (only if missing)
        if: steps.dotnet_probe.outputs.has_sdk8 != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Whatever path got us here, the build must not proceed on the wrong band.
      #
      # Finding an 8.0.x SDK is not the same as using it: without a global.json the dotnet host
      # resolves the HIGHEST installed SDK for every command, so a 9.x or 10.x SDK installed on the
      # runner one day would silently build this solution and run dotnet-ef. The repository keeps
      # no global.json (developers and the other jobs are unchanged), so this job writes a
      # temporary one at the workspace root: every dotnet command below (tool restore, dotnet ef
      # inside apply-migrations.ps1, restore, build) runs from the workspace root, so the pin
      # governs all of them. 'latestFeature' rolls forward to the newest installed 8.0.x feature
      # band and never past 8.0. The resolved SDK is then asserted, not assumed. The file is
      # removed at the end of the job (the runner workspace is shared by every workflow).
      - name: Verify .NET 8 SDK is usable and pin it for this job
        id: sdk_pin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdks = @(dotnet --list-sdks 2>&1)
          if (-not ($sdks | Where-Object { $_ -match '^8\.0\.' })) {
            Write-Host "::error::No .NET 8 SDK is available to the runner service account."
            Write-Host "::error::Every backend project targets net8.0. Install the .NET 8 SDK on"
            Write-Host "::error::AOVIA1VMS011 and confirm it is on the runner service PATH."
            $sdks | ForEach-Object { Write-Host "  $_" }
            throw "Required .NET 8 SDK is not installed on the PRODUCTION runner."
          }
          Write-Host "OK - .NET 8 SDK(s) installed:"
          $sdks | Where-Object { $_ -match '^8\.0\.' } | ForEach-Object { Write-Host "  $_" }

          $globalJson = Join-Path $env:GITHUB_WORKSPACE 'global.json'
          if (Test-Path -LiteralPath $globalJson) {
            Write-Host "A global.json is already present in the workspace; it is honored, not overwritten:"
            Get-Content -LiteralPath $globalJson | ForEach-Object { Write-Host "  $_" }
            "pinned_global_json=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            $pin = [ordered]@{ sdk = [ordered]@{ version = '8.0.100'; rollForward = 'latestFeature'; allowPrerelease = $false } }
            $pin | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath $globalJson -Encoding utf8
            Write-Host "Temporary global.json written at the workspace root (SDK 8.0.100, rollForward latestFeature)."
            "pinned_global_json=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

          $effectiveRaw = (dotnet --version 2>&1 | Out-String).Trim()
          $effective = ($effectiveRaw -split "`r?`n")[0].Trim()
          Write-Host "Effective SDK resolved by the host from the workspace root: $effective"
          if ($effective -notmatch '^8\.0\.\d+$') {
            Write-Host $effectiveRaw
            Write-Host "::error::The dotnet host did not resolve an 8.0.x SDK from the workspace root. Refusing to build the migration bundle on another SDK band."
            throw "Effective .NET SDK is '$effective'; an 8.0.x SDK is required."
          }
          Write-Host "OK - every dotnet command in this job runs on SDK $effective."

      # --- Restore the repo-pinned LOCAL dotnet-ef tool (.config/dotnet-tools.json -> 8.0.11) ---
      # Deterministic: uses the manifest version regardless of any global tool on the runner.
      # We never install/update/uninstall the global dotnet-ef tool. Same strategy as TEST.
      - name: Restore local dotnet-ef tool
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool restore failed." }

          $efVersion = (dotnet ef --version 2>&1 | Out-String)
          Write-Host "dotnet ef --version:"
          Write-Host $efVersion
          if ($efVersion -notmatch '8\.0\.11') {
            throw "Expected dotnet-ef 8.0.11 but a different version is in effect. Aborting."
          }
          Write-Host "OK - dotnet-ef 8.0.11 confirmed."

      # --- Restore and Build ---
      - name: Restore backend dependencies
        run: dotnet restore src/backend/AlplaPortal.sln

      - name: Build backend
        run: dotnet build src/backend/AlplaPortal.sln --configuration Release --no-restore

      # --- Read Connection String ---
      - name: Read PRODUCTION connection string
        id: connstr
        shell: pwsh
        run: |
          $connStr = "${{ secrets.PROD_DB_CONNECTION_STRING }}"

          if ([string]::IsNullOrWhiteSpace($connStr)) {
            # Fallback: try reading from deployed appsettings.Production.json
            $apiDeploy = "${{ vars.API_DEPLOY_PATH }}"
            $configFile = Join-Path $apiDeploy "appsettings.Production.json"
            if (Test-Path $configFile) {
              $config = Get-Content $configFile -Raw | ConvertFrom-Json
              $connStr = $config.ConnectionStrings.DefaultConnection
            }
          }

          if ([string]::IsNullOrWhiteSpace($connStr)) {
            throw "No PRODUCTION connection string available. Set PROD_DB_CONNECTION_STRING secret or deploy appsettings.Production.json first."
          }

          # Mask the connection string in logs
          Write-Host "::add-mask::$connStr"
          "MIGRATION_CONN_STR=$connStr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "::notice::PRODUCTION connection string loaded."

      # --- Pre-flight Database Safety Check ---
      - name: Validate target database identity
        shell: pwsh
        run: |
          $conn = New-Object System.Data.SqlClient.SqlConnection($env:MIGRATION_CONN_STR)
          $conn.Open()
          $cmd = $conn.CreateCommand()
          $cmd.CommandText = "SELECT DB_NAME()"
          $dbName = $cmd.ExecuteScalar()
          $conn.Close()

          Write-Host "::notice::Pre-flight check: connected to [$dbName]"

          if ($dbName -eq "Portal-Gerencial-Test") {
            Write-Host "::error::CRITICAL SAFETY CHECK FAILED: Connection resolves to TEST database!"
            Write-Host "::error::PRODUCTION migration BLOCKED. Fix the connection string."
            throw "PRODUCTION migration blocked: target is Portal-Gerencial-Test."
          }

          if ($dbName -ne "Portal-Gerencial") {
            Write-Host "::error::SAFETY CHECK FAILED: Expected [Portal-Gerencial], got [$dbName]."
            throw "PRODUCTION migration blocked: unexpected database name."
          }

          Write-Host "::notice::Database identity verified: [Portal-Gerencial]"

      # --- Apply Migrations ---
      - name: Apply pending migrations
        shell: pwsh
        run: |
          $backupDir = "${{ vars.BACKUP_PATH }}"
          if ([string]::IsNullOrWhiteSpace($backupDir)) {
            # Fail-closed: no hard-coded fallback drive (the old C:\ literal is exactly how the
            # system disk filled up — PROD deploy run #46 died with 61 MB free).
            throw "BACKUP_PATH environment variable is not set for PRODUCTION. Configure it (e.g. D:\Backups\AlplaPortal\Prod) before applying migrations."
          }
          $backupDir = Join-Path $backupDir "db"
          $beforeNewest = Get-ChildItem -LiteralPath $backupDir -Filter '*_pre-migration.bak' -File -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1

          & "${{ github.workspace }}\scripts\db\apply-migrations.ps1" `
            -ConnectionString $env:MIGRATION_CONN_STR `
            -Environment PROD `
            -BackupDir $backupDir `
            -RepoRoot "${{ github.workspace }}" `
            -ExpectedDatabase "Portal-Gerencial"

          # Retention (approved policy): runs ONLY when THIS run secured a new pre-migration
          # backup (a no-pending-migrations run creates none and must not clean anything).
          # Best-effort inside the helper — warnings only, never fails the workflow.
          $afterNewest = Get-ChildItem -LiteralPath $backupDir -Filter '*_pre-migration.bak' -File -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          if ($afterNewest -and (-not $beforeNewest -or $afterNewest.Name -ne $beforeNewest.Name)) {
            & "${{ github.workspace }}\scripts\deploy\backup-retention.ps1" -BackupRoot $backupDir -Mode Database
          } else {
            Write-Host "No new database backup was created this run - retention skipped."
          }

      # --- Remove the temporary SDK pin (only the file this job wrote) ---
      - name: Remove temporary global.json
        if: always() && steps.sdk_pin.outputs.pinned_global_json == 'true'
        shell: pwsh
        run: |
          $globalJson = Join-Path $env:GITHUB_WORKSPACE 'global.json'
          if (Test-Path -LiteralPath $globalJson) {
            Remove-Item -LiteralPath $globalJson -Force
            Write-Host "Temporary global.json removed."
          } else {
            Write-Host "Temporary global.json already gone."
          }

      # --- Summary ---
      - name: Migration summary
        if: always()
        shell: pwsh
        run: |
          # This step runs on EVERY outcome (if: always()) so the summary is never missing, which is
          # why it also printed after the cancelled run #28. The job outcome comes first: nothing
          # below applies unless it reads 'success'.
          $outcome = "${{ job.status }}"
          Write-Host "============================================="
          Write-Host "  PRODUCTION Migration Summary"
          Write-Host "============================================="
          Write-Host "Job outcome:  $outcome"
          Write-Host "Version:      ${{ inputs.version }}"
          Write-Host "Database:     Portal-Gerencial"
          Write-Host "Server:       AOVIA1VMS011"
          Write-Host "============================================="
          Write-Host ""
          if ($outcome -ne 'success') {
            Write-Host "::warning::Job outcome is '$outcome' - the migration step did NOT complete. Do NOT proceed to 'Deploy to PRODUCTION'."
            Write-Host "Review the failed/cancelled step above and re-run this workflow after the cause is fixed."
          } else {
            Write-Host "If migrations were applied successfully:"
            Write-Host "  -> Run 'Deploy to PRODUCTION' workflow with version ${{ inputs.version }}"
            Write-Host ""
            Write-Host "If no migrations were pending:"
            Write-Host "  -> Proceed directly to 'Deploy to PRODUCTION'"
          }
          Write-Host "============================================="
